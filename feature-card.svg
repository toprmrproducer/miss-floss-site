<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-label="MissFloss.ai feature card">
  <defs>
    <radialGradient id="fGlow" cx="0.5" cy="0.0" r="0.8"><stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22"/><stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <linearGradient id="fBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0c0c0f"/><stop offset="100%" stop-color="#08080a"/></linearGradient>
  </defs>
  <rect width="800" height="540" rx="20" fill="url(#fBg)"/>
  <rect width="800" height="540" rx="20" fill="url(#fGlow)"/>

  <!-- SMS message bubbles -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" transform="translate(64,80)">
    <g>
      <rect width="320" height="74" rx="18" fill="#3B82F6" fill-opacity="0.16" stroke="#3B82F6" stroke-opacity="0.4"/>
      <text x="22" y="28" font-size="10" font-weight="700" fill="#3B82F6">MISS FLOSS · SMS</text>
      <text x="22" y="50" font-size="13" fill="#e5e7eb">Hi Sarah! Quick reminder: cleaning</text>
      <text x="22" y="68" font-size="13" fill="#e5e7eb">Thursday at 9am with Dr. Patel.</text>
    </g>
    <g transform="translate(232,120)">
      <rect width="240" height="56" rx="18" fill="#101013" stroke="#1c1c22"/>
      <text x="22" y="22" font-size="10" font-weight="700" fill="#7a7a85">SARAH</text>
      <text x="22" y="42" font-size="13" fill="#e5e7eb">Confirmed! See you then 🦷</text>
    </g>
    <g transform="translate(0,228)">
      <rect width="380" height="98" rx="18" fill="#3B82F6" fill-opacity="0.16" stroke="#3B82F6" stroke-opacity="0.4"/>
      <text x="22" y="28" font-size="10" font-weight="700" fill="#3B82F6">MISS FLOSS · SMS</text>
      <text x="22" y="50" font-size="13" fill="#e5e7eb">Great. Your Delta PPO covers 100%</text>
      <text x="22" y="68" font-size="13" fill="#e5e7eb">on this visit. Forms attached — please</text>
      <text x="22" y="86" font-size="13" fill="#e5e7eb">fill before Thursday.</text>
    </g>
  </g>

  <!-- Right column: phone mockup -->
  <g transform="translate(520,60)" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect width="220" height="420" rx="32" fill="#0a0a0c" stroke="#1c1c22"/>
    <rect x="14" y="14" width="192" height="392" rx="20" fill="#101013"/>
    <!-- screen content -->
    <text x="110" y="46" text-anchor="middle" font-size="10" fill="#7a7a85">Today · 9:02 AM</text>
    <g transform="translate(28,68)">
      <rect width="164" height="44" rx="10" fill="#3B82F6" fill-opacity="0.18"/>
      <text x="12" y="20" font-size="9" font-weight="700" fill="#3B82F6">MISS FLOSS</text>
      <text x="12" y="36" font-size="11" fill="#e5e7eb">Reminder: 9 AM cleaning</text>
    </g>
    <g transform="translate(28,124)">
      <rect width="164" height="32" rx="10" fill="#0a0a0c"/>
      <text x="12" y="20" font-size="11" fill="#e5e7eb">On my way!</text>
    </g>
    <g transform="translate(28,168)">
      <rect width="164" height="44" rx="10" fill="#3B82F6" fill-opacity="0.18"/>
      <text x="12" y="20" font-size="9" font-weight="700" fill="#3B82F6">MISS FLOSS</text>
      <text x="12" y="36" font-size="11" fill="#e5e7eb">Insurance verified ✓</text>
    </g>
    <g transform="translate(28,224)">
      <rect width="164" height="60" rx="10" fill="#3B82F6" fill-opacity="0.18"/>
      <text x="12" y="20" font-size="9" font-weight="700" fill="#3B82F6">MISS FLOSS</text>
      <text x="12" y="36" font-size="11" fill="#e5e7eb">Thanks for coming in!</text>
      <text x="12" y="52" font-size="11" fill="#e5e7eb">Next recall: Dec 9</text>
    </g>
  </g>
</svg>
